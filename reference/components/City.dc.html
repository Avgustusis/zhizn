rif" font-size="1.75" fill="#1E1E24">5–6: −1 своё</text><text x="659" y="304.4" font-family="'IBM Plex Mono', monospace" font-size="1.8" fill="#1E1E24" font-weight="600">Д × 2 + 1 · отметка стажа</text><text x="733.5" y="291" font-family="'PT Serif', serif" font-size="2.3" fill="#1E1E24" font-weight="700">Своё дело</text><text x="733.5" y="294.7" font-family="'PT Sans', sans-serif" font-size="1.75" fill="#1E1E24">есть карта дела: вместо работы</text><text x="733.5" y="297.8" font-family="'PT Sans', sans-serif" font-size="1.75" fill="#1E1E24">износа здоровья нет</text><text x="733.5" y="300.9" font-family="'PT Sans', sans-serif" font-size="1.75" fill="#1E1E24">на входе в отрезок — риск</text><text x="733.5" y="304.4" font-family="'IBM Plex Mono', monospace" font-size="1.8" fill="#1E1E24" font-weight="600">Д + бонус дела · отметка ○</text><text x="510" y="308.6" font-family="'PT Sans', sans-serif" font-size="1.65" fill="#4A4A55" font-style="italic">«Своё» здоровье: Народ, Армия — физ.; Интеллигенция, Полиция, Олигархи — псих. Мафия здоровье не тратит, но на d6 = 1 — «Дурная слава» (Переработка:</text><text x="510" y="310.61" font-family="'PT Sans', sans-serif" font-size="1.65" fill="#4A4A55" font-style="italic">−1 физ., −1 псих. и «Дурная слава» на d6 1–2). Здоровье на −8 и ниже износ не трогает: потеря уходит в другое. Своё дело: бонус +1…+3 по карте дела, ±</text><text x="510" y="312.63" font-family="'PT Sans', sans-serif" font-size="1.65" fill="#4A4A55" font-style="italic">идеология; отметка ○ идёт в Стаж, но не в пенсию.</text><rect x="507" y="330" width="99" height="94" fill="#F8F5EE" stroke="#1E1E24" stroke-width="0.5" /><text x="509.5" y="334.8" font-family="'IBM Plex Mono', monospace" font-size="2.5" fill="#1E1E24" font-weight="600" letter-spacing="0.35">ОБЯЗАТЕЛЬНЫЕ ТРАТЫ · за ход</text><line x1="509" y1="336.4" x2="604" y2="336.4" stroke="#1E1E24" stroke-width="0.25" /><text x="510" y="341" font-family="'PT Sans', sans-serif" font-size="1.95" fill="#1E1E24"> E24" font-weight="600">+1</text><text x="556.5" y="370.5" font-family="'IBM Plex Mono', monospace" font-size="1.85" fill="#1E1E24">7–9</text><text x="556.5" y="374.5" font-family="'IBM Plex Mono', monospace" font-size="2.1" fill="#1E1E24" font-weight="600">+2</text><text x="579.75" y="370.5" font-family="'IBM Plex Mono', monospace" font-size="1.85" fill="#1E1E24">10+</text><text x="579.75" y="374.5" font-family="'IBM Plex Mono', monospace" font-size="2.1" fill="#1E1E24" font-weight="600">+3</text><text x="510" y="421.5" font-family="'PT Sans', sans-serif" font-size="1.85" fill="#A8322B" font-weight="700">Дошёл до −15 возм. — кабала.</text><rect x="609.5" y="330" width="99" height="94" fill="#F8F5EE" stroke="#1E1E24" stroke-width="0.5" /><text x="612" y="334.8" font-family="'IBM Plex Mono', monospace" font-size="2.5" fill="#1E1E24" font-weight="600" letter-spacing="0.35">КОГДА РЫНОК ЗАКРЫТ</text><line x1="611.5" y1="336.4" x2="706.5" y2="336.4" stroke="#1E1E24" stroke-width="0.25" /><text x="612.5" y="341" font-family="'IBM Plex Mono', monospace" font-size="1.95" fill="#A8322B" font-weight="600">псих. −5 и ниже</text><text x="612.5" y="344" font-family="'PT Sans', sans-serif" font-size="1.85" fill="#1E1E24">спортзал, курсы, салон, путешествие, хобби,</text><text x="612.5" y="346.26" font-family="'PT Sans', sans-serif" font-size="1.85" fill="#1E1E24">переработка; работа — как подработка, дело —</text><text x="612.5" y="348.51" font-family="'PT Sans', sans-serif" font-size="1.85" fill="#1E1E24">половина</text><text x="612.5" y="352.17" font-family="'IBM Plex Mono', monospace" font-size="1.95" fill="#A8322B" font-weight="600">псих. −8 и ниже</text><text x="612.5" y="355.17" font-family="'PT Sans', sans-serif" font-size="1.85" fill="#1E1E24">вдобавок любая работа и храм (Усердие работает</text><text x="612.5" y="357.43" font-family="'PT Sans', sans-serif" font-size="1.85" fill="#1E1E24">до −8)</text><text x="612.5" y="361.08" font-family="'IBM Plex Mono', monospace" font-size="1.95" fill="#A8322B" font-weight="600">физ. −5 и ниже</text><text x="612.5" y="364.08" font-family="'PT Sans', sans-serif" font-size="1.85" fill="#1E1E24">спортзал, путешествие, переработка, бордель</text><text x="612.5" y="367.74" font-family="'IBM Plex Mono', monospace" font-size="1.95" fill="#A8322B" font-weight="600">Старость, Древность</text><text x="612.5" y="370.74" font-family="'PT Sans', sans-serif" font-size="1.85" fill="#1E1E24">спортзал и переработка</text><text x="612.5" y="374.4" font-family="'IBM Plex Mono', monospace" font-size="1.95" fill="#2E6B3A" font-weight="600">открыто всегда</text><text x="612.5" y="377.4" font-family="'PT Sans', sans-serif" font-size="1.85" fill="#1E1E24">психолог, больница, семья, обряд — и ловушки</text><text x="612.5" y="418" font-family="'PT Sans', sans-serif" font-size="1.85" fill="#1E1E24" font-weight="700">Рынок не убивает: здоровье останавливается на −9.</text><text x="612.5" y="421.4" font-family="'PT Sans', sans-serif" font-size="1.7" fill="#4A4A55">Это срыв: ход пропущен, открыты больница, психолог, семья, обряд.</text><rect x="712" y="330" width="99" height="94" fill="#F8F5EE" stroke="#1E1E24" stroke-width="0.5" /><text x="714.5" y="334.8" font-family="'IBM Plex Mono', monospace" font-size="2.5" fill="#1E1E24" font-weight="600" letter-spacing="0.35">ПОПРАВКИ ПО ПОЗИЦИИ СТРАНЫ</text><line x1="714" y1="336.4" x2="809" y2="336.4" stroke="#1E1E24" stroke-width="0.25" /><text x="715" y="341" font-family="'PT Serif', serif" font-size="2.3" fill="#1E1E24" font-weight="700">Ядро</text><text x="717" y="344.1" font-family="'PT Sans', sans-serif" font-size="1.85" fill="#1E1E24">· большой обмен у врача и психолога −3</text><text x="717" y="347.2" font-family="'PT Sans', sans-serif" font-size="1.85" fill="#1E1E24">· работа +1 к доходу</text><text x="717" y="350.3" font-family="'PT Sans', sans-serif" font-size="1.85" fill="#1E1E24">· банк: +4 сейчас, −5 потом</text><text x="715" y="354.7" font-family="'PT Serif', serif"  Sans', sans-serif" font-size="1.9" fill="#1E1E24">все три кольца</text><text x="622" y="530.6" font-family="'PT Sans', sans-serif" font-size="1.9" fill="#1E1E24" font-weight="700">Олигархи</text><text x="647" y="530.6" font-family="'PT Sans', sans-serif" font-size="1.9" fill="#1E1E24">везде</text><text x="622" y="533.7" font-family="'PT Sans', sans-serif" font-size="1.9" fill="#1E1E24" font-weight="700">Мафия</text><text x="647" y="533.7" font-family="'PT Sans', sans-serif" font-size="1.9" fill="#1E1E24">на кольцо глубже своей страны</text><text x="622" y="538.3" font-family="'PT Sans', sans-serif" font-size="1.7" fill="#1E1E24">Рынком в любом здании пользуются все, как раньше: кольцо ограничивает только знакомства. ▲ Выбери здание с колодой в доступном кольце (одно здание — раз в отрезок), открой встречу и сдвинь характер на шаг к одному из её полюсов — или</text><text x="622" y="540.55" font-family="'PT Sans', sans-serif" font-size="1.7" fill="#1E1E24">на шаг к нулю по одной из её осей. 📇 — d6 4–6 (в Центре 3–6): тяни «Знакомого». Карту — под низ. На вывеске: ▲ — малый обмен или знакомство; ▲▲ — есть и большой обмен.</text><rect x="621" y="546.8" width="188" height="78.2" fill="#FBF8F1" stroke="#1E1E24" stroke-width="0.3" /><rect x="623" y="549.2" width="2.8" height="2.8" fill="#2E6B3A" stroke="none" stroke-width="0" /><text x="627" y="551.8" font-family="'IBM Plex Mono', monospace" font-size="2.2" fill="#1E1E24" font-weight="700" letter-spacing="0.3">КОНТОРА — ОТКРЫТЬ СВОЁ ДЕЛО</text><text x="623.5" y="555.4" font-family="'PT Sans', sans-serif" font-size="1.6" fill="#4A4A55" font-style="italic">Вместо работы, в Молодости—Старости, если дела нет; одна попытка за отрезок. Дело — по классу и только законное в стране. Провал: половина цены назад, −1 псих. Карта события даёт дело на 2 дешевле.</text><text x="623.5" y="562.8" font-family="'IBM Plex Mono', monospace" font-size="1.5" fill="#4A4A55" font-weight="600">Дело</text><text x="683" y="562.8" font-family="'IBM P
