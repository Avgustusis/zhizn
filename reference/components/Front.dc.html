<rect x="121.6" y="33.74" width="168.15" height="9.62" fill="#E3EBDB" stroke="none" stroke-width="0" /><text x="127.24" y="37.31" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">1</text><text x="131.88" y="37.31" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Флаг над ратушей.</text><text x="161.79" y="37.31" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Флаг над ратушей поднимают пятый раз — для разных фотографов.</text><text x="131.88" y="41.53" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">+2 псих.; Самолюбие: ещё +1 псих.</text><text x="127.24" y="47.78" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">2</text><text x="131.88" y="47.78" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Подвал с вином.</text><text x="158.47" y="47.78" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">В подвале особняка вино старше тебя. Пробки выбивают штыком.</text><text x="131.88" y="52" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Аппетит: +2 псих., −2 физ. Мера: +1 псих., +1 физ. Остальные: +1 псих., −1 физ.</text><rect x="121.6" y="54.68" width="168.15" height="18.05" fill="#E3EBDB" stroke="none" stroke-width="0" /><text x="127.24" y="58.25" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">3</text><text x="131.88" y="58.25" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Горожане.</text><text x="148.97" y="58.25" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Горожане вышли из подвалов. Смотрят без ненависти: на ненависть нет сил.</text><text x="131.88" y="62.47" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">А) раздать свой хлеб (Щедрость): −1 физ., +1 псих. Б) не смотреть им в глаза (Хватка): −1 псих. Офицер:</text><text x="131.88" y="66.69" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">А) открыть армейскую кухню для всех (Участие): −1 возм., +1 псих. Б) кормить только своих (Самолюбие):</text><text x="131.88" y="70.9" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−1 псих.</text><text x="127.24" y="77.16" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">4</text><text x="131.88" y="77.16" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Снайпер на колокольне.</text><text x="170.06" y="77.16" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Город сдался, а снайпер на колокольне об этом не знает.</text><text x="131.88" y="81.37" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">🎲 Ловкость 12: успех — −1 псих.; провал — −3 физ., −1 псих.</text><rect x="121.6" y="84.06" width="168.15" height="13.84" fill="#E3EBDB" stroke="none" stroke-width="0" /><text x="127.24" y="87.63" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">5</text><text x="131.88" y="87.63" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Счёт.</text><text x="141.14" y="87.63" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">В этом городе живут те, кто жёг твою деревню. Или такие же, как они.</text><text x="131.88" y="91.85" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">А) свести счёт (сильная Вспыльчивость): +1 псих., отметка «Кровь на руках», d6 1–2 — трибунал: тюрьма</text><text x="131.88" y="96.06" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">(тяжёлое). Б) уйти (Выдержка): −1 псих.</text><text x="127.24" y="102.32" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">6</text><text x="131.88" y="102.32" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Посылка домой.</text><text x="158.28" y="102.32" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Разрешено отправить домой одну посылку. Весом до пуда.</text><text x="131.88" y="106.53" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Хватка: +4 возм. Щедрость: +1 возм., +1 псих. Остальные: +2 возм.</text><rect x="121.6" y="109.22" width="168.15" height="13.84" fill="#E3EBDB" stroke="none" stroke-width="0" /><text x="127.24" y="112.79" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">7</text><text x="131.88" y="112.79" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Ключи от музея.</text><text x="158.19" y="112.79" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Город отдаёт ключи от музея. Берёт их тот, кто первым спросил.</text><text x="131.88" y="117.01" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">А) вывезти картину (Хватка): +4 возм., d6 1 — трибунал: тюрьма. Б) встать у дверей на караул</text><text x="131.88" y="121.22" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">(Скромность): +1 псих., d6 6 — +1 Мудрость до 7</text><text x="127.24" y="127.48" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">8</text><text x="131.88" y="127.48" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Парад.</text><text x="144.07" y="127.48" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Парад по главной улице чужого города. Город смотрит из-за штор.</text><text x="131.88" y="131.69" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Самолюбие: +2 псих. Остальные: +1 псих. Офицер: +1 псих., награда</text><rect x="121.6" y="134.38" width="168.15" height="9.62" fill="#E3EBDB" stroke="none" stroke-width="0" /><text x="127.24" y="137.95" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">9</text><text x="131.88" y="137.95" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Цветы.</text><text x="144.33" y="137.95" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Девочка вручает тебе цветы. Её мать стоит в дверях с каменным лицом.</text><text x="131.88" y="142.17" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Участие: +1 псих. Остальные: лицо матери не забыть: −1 псих.</text><text x="127.24" y="148.42" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">10</text><text x="131.88" y="148.42" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Первыми домой.</text><text x="159.28" y="148.42" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Говорят, вашу роту отправят домой первой. Говорят каждый день.</text><text x="131.88" y="152.64" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">+1 псих., +1 физ.</text><rect x="294.55" y="24" width="169.35" height="146.6" fill="#FBF8F1" stroke="#4F6E46" stroke-width="0.6" /><rect x="294.55" y="24" width="169.35" height="8.2" fill="#4F6E46" stroke="none" stroke-width="0" /><text x="296.95" y="30.1" font-family="'PT Serif', serif" font-size="4.6" fill="#FBF8F1" font-weight="700">+6</text><text x="309.55" y="29.6" font-family="'IBM Plex Mono', monospace" font-size="2.7" fill="#FBF8F1" font-weight="700" letter-spacing="0.3">ОКРУЖЕНИЕ ПРОТИВНИКА</text><text x="461.5" y="29.6" font-family="'IBM Plex Mono', monospace" font-size="2.4" fill="#FBF8F1" text-anchor="end" font-weight="600">d10</text><rect x="295.15" y="33.74" width="168.15" height="9.62" fill="#E3EBDB" stroke="none" stroke-width="0" /><text x="300.79" y="37.31" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">1</text><text x="305.43" y="37.31" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Котёл.</text><text x="316.94" y="37.31" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Кольцо замкнулось. Внутри сорок тысяч голодных, и ночью их слышно.</text><text x="305.43" y="41.53" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−1 псих.</text><text x="300.79" y="47.78" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">2</text><text x="305.43" y="47.78" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Парламентёры.</text><text x="330.6" y="47.78" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Из котла выходят парламентёры. Белый флаг сшит из простыни.</text><text x="305.43" y="52" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">+1 псих. Офицер: А) принять сдачу по правилам (Участие): +1 псих., награда. Б) тянуть время, пока</text><text x="305.43" y="56.21" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">работает артиллерия (сильное Самолюбие): +1 возм., отметка «Кровь на руках», −1 псих.</text><rect x="295.15" y="58.9" width="168.15" height="9.62" fill="#E3EBDB" stroke="none" stroke-width="0" /><text x="300.79" y="62.47" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">3</text><text x="305.43" y="62.47" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Прорыв из котла.</text><text x="333.28" y="62.47" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Окружённые идут на прорыв ночью — прямо на вашу траншею.</text><text x="305.43" y="66.69" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">🎲 Выносливость 15: успех — награда; провал — −3 физ., −1 псих.</text><text x="300.79" y="72.94" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">4</text><text x="305.43" y="72.94" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Пленным нечего есть.</text><text x="340.31" y="72.94" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Пленных больше, чем пайков. Пайки — ваши.</text><text x="305.43" y="77.16" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">А) делиться пайком (Щедрость): −1 физ., +1 псих. Б) не твоё дело (Хватка): −1 псих.</text><rect x="295.15" y="79.84" width="168.15" height="9.62" fill="#E3EBDB" stroke="none" stroke-width="0" /><text x="300.79" y="83.41" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">5</text><text x="305.43" y="83.41" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Трофейные часы.</text><text x="333.47" y="83.41" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">У каждого второго в роте теперь трофейные часы. У некоторых — по три.</text><text x="305.43" y="87.63" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Хватка: +2 возм. Остальные: +1 возм.</text><text x="300.79" y="93.89" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">6</text><text x="305.43" y="93.89" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Знакомый говор.</text><text x="332.84" y="93.89" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Среди пленных — человек твоей культуры. Он узнаёт тебя по говору и молчит.</text><text x="305.43" y="98.1" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−1 псих.; А) сунуть ему хлеб (Щедрость): +1 псих. Б) отвернуться (Самолюбие): −1 псих.</text><rect x="295.15" y="100.79" width="168.15" height="9.62" fill="#E3EBDB" stroke="none" stroke-width="0" /><text x="300.79" y="104.36" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">7</text><text x="305.43" y="104.36" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Последние патроны.</text><text x="338.28" y="104.36" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Котёл огрызается. Последние патроны они тратят на вас.</text><text x="305.43" y="108.57" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−2 физ.</text><text x="300.79" y="114.83" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">8</text><text x="305.43" y="114.83" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Баня.</text><text x="315.47" y="114.83" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Нашли целую баню. Горячая вода — впервые за месяц.</text><text x="305.43" y="119.05" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">+1 физ., +1 псих.</text><rect x="295.15" y="121.73" width="168.15" height="9.62" fill="#E3EBDB" stroke="none" stroke-width="0" /><text x="300.79" y="125.3" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">9</text><text x="305.43" y="125.3" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Снимок для газеты.</text><text x="336.83" y="125.3" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Фотограф строит вас для снимка «Победители котла». Небритых — назад.</text><text x="305.43" y="12 xt x="478.98" y="66.69" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">пройдут (Участие): +1 псих., фронт −1</text><text x="474.34" y="72.94" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">4</text><text x="478.98" y="72.94" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Чужой дом.</text><text x="498.41" y="72.94" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Ночёвка в пустом доме. На стене — детские рисунки, на плите — остывший суп.</text><text x="478.98" y="77.16" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−1 псих.; Верность: пишешь домой: +1 псих.</text><rect x="468.7" y="79.84" width="168.15" height="9.62" fill="#E3EBDB" stroke="none" stroke-width="0" /><text x="474.34" y="83.41" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">5</text><text x="478.98" y="83.41" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Склад с куртками.</text><text x="507.98" y="83.41" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Склад тёплых курток. Куртки на размер больше, но кто сейчас мерит.</text><text x="478.98" y="87.63" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">+1 физ.</text><text x="474.34" y="93.89" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">6</text><text x="478.98" y="93.89" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Ночной марш.</text><text x="502.33" y="93.89" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Тридцать вёрст за ночь по болоту. Болото про войну не знает.</text><text x="478.98" y="98.1" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Усердие: −1 псих. Остальные: 🎲 Выносливость 15: успех — −1 псих.; провал — −2 физ., −1 псих.</text><rect x="468.7" y="100.79" width="168.15" height="9.62" fill="#E3EBDB" stroke="none" stroke-width="0" /><text x="474.34" y="104.36" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">7</text><text x="478.98" y="104.36" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Тыловики сдаются.</text><text x="509.43" y="104.36" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Писари, повара и кладовщики сдаются целыми канцеляриями.</text><text x="478.98" y="108.57" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">+1 псих. Офицер: +1 псих., +1 возм.</text><text x="474.34" y="114.83" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">8</text><text x="478.98" y="114.83" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Молоко.</text><text x="493.39" y="114.83" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Человек из деревни приносит молоко и спрашивает, как тебя зовут.</text><text x="478.98" y="119.05" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Влюбчивость: +2 псих., есть Супруг(а) или Партнёр: d6 1–2 — дома узнали: Сплочённость −1. Верность:</text><text x="478.98" y="123.26" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">тоскуешь по дому: −1 псих. Остальные: ничего</text><rect x="468.7" y="125.95" width="168.15" height="9.62" fill="#E3EBDB" stroke="none" stroke-width="0" /><text x="474.34" y="129.52" font-family="'PT Serif', serif" font-size="3.81" fill="#4F6E46" text-anchor="middle" font-weight="700">9</text><text x="478.98" y="129.52" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Отрезаны.</text><text x="496.51" y="129.52" font-family="'PT Sans', sans-serif" font-size= 3.4" fill="#1E1E24" font-weight="700">Ракета.</text><text x="491.86" y="217.49" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Осветительная ракета висит над полем целую вечность.</text><text x="478.98" y="221.7" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Выдержка: ничего. Вспыльчивость: −2 физ., −1 псих. Остальные: −1 псих., d6 1–2 — ещё −2 физ.</text><text x="474.34" y="227.96" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">4</text><text x="478.98" y="227.96" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Мальчишка.</text><text x="499.08" y="227.96" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Языку лет шестнадцать. Он плачет и показывает фотографию матери.</text><text x="478.98" y="232.17" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">А) довести до штаба (Участие): в штабе его накормили: +1 псих. Б) «через поле его не дотащить»</text><text x="478.98" y="236.39" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">(сильное Самолюбие): −1 псих., отметка «Кровь на руках»</text><rect x="468.7" y="239.08" width="168.15" height="9.62" fill="#ECEAE4" stroke="none" stroke-width="0" /><text x="474.34" y="242.65" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">5</text><text x="478.98" y="242.65" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Карта в блиндаже.</text><text x="508.92" y="242.65" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">В брошенном блиндаже — карта с пометками. Пометки сделаны на твоём языке.</text><text x="478.98" y="246.86" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">🎲 Интеллект 12: успех — фронт +1; провал — ничего</text><text x="474.34" y="253.12" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">6</text><text x="478.98" y="253.12" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Пёс-связной.</text><text x="500.19" y="253.12" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Пёс пришёл с той стороны с запиской в ошейнике. Записка не тебе.</text><text x="478.98" y="257.33" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">+1 псих.</text><rect x="468.7" y="260.02" width="168.15" height="9.62" fill="#ECEAE4" stroke="none" stroke-width="0" /><text x="474.34" y="263.59" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">7</text><text x="478.98" y="263.59" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Своя артиллерия.</text><text x="507.27" y="263.59" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">По вам бьёт своя артиллерия. Связист орёт в трубку цифры.</text><text x="478.98" y="267.81" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">🎲 Смекалка 12: успех — −1 физ.; провал — −2 физ., −1 псих.</text><text x="474.34" y="274.06" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">8</text><text x="478.98" y="274.06" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Тихий проход.</text><text x="502.52" y="274.06" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Прошли туда и обратно, и никто не выстрелил. Такое бывает раз за войну.</text><text x="478.98" y="278.28" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">+1 псих.</text><rect x="468.7" y="280.96" width="168.15" height="13.84" fill="#ECEAE4" stroke="none" stroke-width="0" /><text x="474.34" y="284.53" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">9</text><text x="478.98" y="284.53" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Тяжёлый разведчик.</text><text x="511.54" y="284.53" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Разведчик из соседнего взвода ранен в ногу и тяжёл, как мешок цемента.</text><text x="478.98" y="288.75" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">А) нести (Участие): −1 физ., +1 псих., козырь «Боевые друзья». Б) оставить с флягой (Самолюбие): −2</text><text x="478.98" y="292.97" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">псих., d6 1–2 — он не дождался: −1 псих.</text><text x="474.34" y="299.22" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">10</text><text x="478.98" y="299.22" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Чужой подвиг.</text><text x="502.57" y="299.22" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">В наградном листе твоя фамилия. Подвиг был не твой.</text><text x="478.98" y="303.44" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">А) промолчать (Самолюбие): награда, −1 псих. Б) сказать как было (Скромность): +1 псих., d6 1 —</text><text x="478.98" y="307.65" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">командир обиделся: −1 возм.</text><rect x="641.65" y="174.8" width="169.35" height="146.6" fill="#FBF8F1" stroke="#77746C" stroke-width="0.6" /><rect x="641.65" y="174.8" width="169.35" height="8.2" fill="#77746C" stroke="none" stroke-width="0" /><text x="644.05" y="180.9" font-family="'PT Serif', serif" font-size="4.6" fill="#FBF8F1" font-weight="700">0</text><text x="656.65" y="180.4" font-family="'IBM Plex Mono', monospace" font-size="2.7" fill="#FBF8F1" font-weight="700" letter-spacing="0.3">ЛИНИИ СОПРИКОСНОВЕНИЯ</text><text x="808.6" y="180.4" font-family="'IBM Plex Mono', monospace" font-size="2.4" fill="#FBF8F1" text-anchor="end" font-weight="600">d10</text><rect x="642.25" y="184.54" width="168.15" height="9.62" fill="#ECEAE4" stroke="none" stroke-width="0" /><text x="647.89" y="188.11" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">1</text><text x="652.53" y="188.11" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Письмо из дома.</text><text x="679.41" y="188.11" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Конверт мятый, штемпель трёхнедельный. Внутри всё ещё пахнет домом.</text><text x="652.53" y="192.33" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">+1 псих.; есть Супруг(а) или Партнёр: ещё +1 псих.</text><text x="647.89" y="198.58" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">2</text><text x="652.53" y="198.58" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Снайпер.</text><text x="668.01" y="198.58" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Над бруствером голову не поднимают. Кто-то поднял.</text><text x="652.53" y="202.8" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">🎲 Ловкость 12: успех — −1 псих.; провал — −3 физ., −1 псих.</text><rect x="642.25" y="205.48" width="168.15" height="9.62" fill="#ECEAE4" stroke="none" stroke-width="0" /><text x="647.89" y="209.05" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">3</text><text x="652.53" y="209.05" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Вода в окопе.</text><text x="675.1" y="209.05" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Вода в окопе по щиколотку третью неделю. Ноги перестают быть твоими.</text><text x="652.53" y="213.27" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Усердие: −1 псих. Остальные: 🎲 Выносливость 12: успех — −1 псих.; провал — −2 физ., −1 псих.</text><text x="647.89" y="219.53" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">4</text><text x="652.53" y="219.53" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Ночной обстрел.</text><text x="679.33" y="219.53" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Снаряды ложатся по расписанию, только расписание знают не все.</text><text x="652.53" y="223.74" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−1 физ.; Выдержка: ничего. Остальные: −1 псих.</text><rect x="642.25" y="226.43" width="168.15" height="9.62" fill="#ECEAE4" stroke="none" stroke-width="0" /><text x="647.89" y="230" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">5</text><text x="652.53" y="230" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Сто грамм.</text><text x="670.48" y="230" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Старшина разливает по кружкам. Тепло приходит быстрее, чем уходит страх.</text><text x="652.53" y="234.21" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">+1 псих.; Аппетит: ещё +1 псих., −1 физ.</text><text x="647.89" y="240.47" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">6</text><text x="652.53" y="240.47" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Песня с той стороны.</text><text x="685.87" y="240.47" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">В ночь Долгого солнца с той стороны запели. Наши подпели. Утром снова стреляли.</text><text x="652.53" y="244.69" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">+1 псих. Офицер: А) не заметить (Участие): +2 псих., d6 1 — особый отдел: −2 возм. Б) доложить</text><text x="652.53" y="248.9" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">(Самолюбие): +1 возм., −1 псих.</text><rect x="642.25" y="251.59" width="168.15" height="9.62" fill="#ECEAE4" stroke="none" stroke-width="0" /><text x="647.89" y="255.16" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">7</text><text x="652.53" y="255.16" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Вши.</text><text x="661.83" y="255.16" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Вошь — самый стойкий солдат этой войны.</text><text x="652.53" y="259.37" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−1 физ., −1 псих.; d6 1 — тиф: ещё −2 физ.</text><text x="647.89" y="265.63" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">8</text><text x="652.53" y="265.63" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Дождь.</text><text x="665.56" y="265.63" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Дождь неделю. В окопе мокрое всё: хлеб, патроны, письма.</text><text x="652.53" y="269.85" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Усердие: −1 псих. Остальные: −1 физ., −1 псих.</text><rect x="642.25" y="272.53" width="168.15" height="22.27" fill="#ECEAE4" stroke="none" stroke-width="0" /><text x="647.89" y="276.1" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">9</text><text x="652.53" y="276.1" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Стон на нейтральной.</text><text x="686.62" y="276.1" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Ночью на нейтральной полосе кто-то стонет. Свой или чужой — по голосу не понять.</text><text x="652.53" y="280.32" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">А) вытащить (Участие): 🎲 Ловкость 15: успех — +1 псих., d6 4–6 — козырь «Боевые друзья»; провал — −3</text><text x="652.53" y="284.53" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">физ. Б) ждать утра (Выдержка): −2 псих. Офицер: А) послать двоих (Самолюбие): −1 псих., d6 1–2 — не</text><text x="652.53" y="288.75" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">вернулись: −2 псих. Б) пойти самому (Участие): 🎲 Ловкость 15: успех — +1 псих., d6 4–6 — козырь</text><text x="652.53" y="292.97" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">«Боевые друзья»; провал — −3 физ.</text><text x="647.89" y="299.22" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">10</text><text x="652.53" y="299.22" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Тишина.</text><text x="666.71" y="299.22" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Третий день не стреляют. Это хуже всего: начинаешь думать.</text><text x="652.53" y="303.44" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Беспечность: отсыпаешься: +1 псих. Усердие: углубляешь окоп: +1 физ., −1 псих. Остальные: −2 псих.</text><rect x="121" y="325.6" width="169.35" height="146.6" fill="#FBF8F1" stroke="#77746C" stroke-width="0.6" /><rect x="121" y="325.6" width="169.35" height="8.2" fill="#77746C" stroke="none" stroke-width="0" /><text x="123.4" y="331.7" font-family="'PT Serif', serif" font-size="4.6" fill="#FBF8F1" font-weight="700">−1</text><text x="136" y="331.2" font-family="'IBM Plex Mono', monospace" font-size="2.7" fill="#FBF8F1" font-weight="700" letter-spacing="0.3">СОРВАННАЯ АТАКА</text><text x="287.95" y="331.2" font-family="'IBM Plex Mono', monospace" font-size="2.4" fill="#FBF8F1" text-anchor="end" font-weight="600">d10</text><rect x="121.6" y="335.34" width="168.15" height="9.62" fill="#ECEAE4" stroke="none" stroke-width="0" /><text x="127.24" y="338.91" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">1</text><text x="131.88" y="338.91" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Назад под огнём.</text><text x="159.95" y="338.91" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Отходить под огнём труднее, чем наступать.</text><text x="131.88" y="343.13" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">🎲 Ловкость 12: успех — −1 псих.; провал — −2 физ., −1 псих.</text><text x="127.24" y="349.38" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">2</text><text x="131.88" y="349.38" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Голоса с поля.</text><text x="154.71" y="349.38" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">На поле остались раненые. Их слышно до утра.</text><text x="131.88" y="353.6" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">А) ползти за ними (Участие): 🎲 Ловкость 15: успех — +1 псих., d6 4–6 — козырь «Боевые друзья»; провал</text><text x="131.88" y="357.81" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">— −3 физ. Б) заткнуть уши (Самолюбие): −2 псих.</text><rect x="121.6" y="360.5" width="168.15" height="9.62" fill="#ECEAE4" stroke="none" stroke-width="0" /><text x="127.24" y="364.07" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">3</text><text x="131.88" y="364.07" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Виноватый.</text><text x="151.34" y="364.07" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Командир ищет виноватого. Виноватый должен быть один.</text><text x="131.88" y="368.29" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−1 псих. Офицер: 🎲 Харизма 15: успех — ничего; провал — −2 возм., −1 псих.</text><text x="127.24" y="374.54" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">4</text><text x="131.88" y="374.54" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Земляк.</text><text x="145.66" y="374.54" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Новенький из пополнения говорит на твоём диалекте.</text><text x="131.88" y="378.76" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Участие: связь «Друг». Остальные: d6 4–6 — связь «Друг»</text><rect x="121.6" y="381.44" width="168.15" height="9.62" fill="#ECEAE4" stroke="none" stroke-width="0" /><text x="127.24" y="385.01" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">5</text><text x="131.88" y="385.01" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Злость.</text><text x="144.66" y="385.01" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">После такого дня хочется кого-нибудь ударить. Под рукой только свои.</text><text x="131.88" y="389.23" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Вспыльчивость: драка: −1 физ., d6 1–2 — особый отдел: −2 возм. Выдержка: +1 псих. Остальные: −1 псих.</text><text x="127.24" y="395.49" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">6</text><text x="131.88" y="395.49" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Сосед не поднялся.</text><text x="162.68" y="395.49" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Атака сорвалась, потому что сосед не поднялся. Сосед это знает.</text><text x="131.88" y="399.7" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">А) прикрыть его в докладе (Участие): d6 4–6 — связь «Друг». Б) доложить как было (Соперничество): −1</text><text x="131.88" y="403.92" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">псих., +1 возм.</text><rect x="121.6" y="406.6" width="168.15" height="9.62" fill="#ECEAE4" stroke="none" stroke-width="0" /><text x="127.24" y="410.17" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">7</text><text x="131.88" y="410.17" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Мокрый снег.</text><text x="153.97" y="410.17" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Мокрый снег идёт сутки и ложится на всех одинаково.</text><text x="131.88" y="414.39" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−1 физ., −1 псих.</text><text x="127.24" y="420.65" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">8</text><text x="131.88" y="420.65" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Письмо в клочки.</text><text x="160.02" y="420.65" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Пишешь письмо и рвёшь. Пишешь и рвёшь.</text><text x="131.88" y="424.86" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Верность: +1 псих. Остальные: −1 псих.</text><rect x="121.6" y="427.55" width="168.15" height="18.05" fill="#ECEAE4" stroke="none" stroke-width="0" /><text x="127.24" y="431.12" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">9</text><text x="131.88" y="431.12" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Вчерашние школьники.</text><text x="169.18" y="431.12" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Пришло пополнение — вчерашние школьники.</text><text x="131.88" y="435.33" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−1 псих.; А) взять одного под крыло (Участие): d6 5–6 — связь «Друг». Б) не запоминать имён</text><text x="131.88" y="439.55" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">(Выдержка): ничего. Офицер: А) учить, пока есть время (Усердие): +1 псих. Б) ставить в первую линию</text><text x="131.88" y="443.77" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">(Самолюбие): −2 псих.</text><text x="127.24" y="450.02" font-family="'PT Serif', serif" font-size="3.81" fill="#77746C" text-anchor="middle" font-weight="700">10</text><text x="131.88" y="450.02" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Особый отдел.</text><text x="155.68" y="450.02" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Особист спрашивает, почему повернул назад именно ты.</text><text x="131.88" y="454.24" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">🎲 Смекалка 12: успех — −1 псих.; провал — −2 возм., −2 псих.</text><rect x="294.55" y="325.6" width="169.35" height="146.6" fill="#FBF8F1" stroke="#7A2A22" stroke-width="0.6" /><rect x="294.55" y="325.6" width="169.35" height="8.2" fill="#7A2A22" stroke="none" stroke-width="0" /><text x="296.95" y="331.7" font-family="'PT Serif', serif" font-size="4.6" fill="#FBF8F1" font-weight="700">−2</text><text x="309.55" y="331.2" font-family="'IBM Plex Mono', monospace" font-size="2.7" fill="#FBF8F1" font-weight="700" letter-spacing="0.3">ПОТЕРЯ ВЫСОТЫ</text><text x="461.5" y="331.2" font-family="'IBM Plex Mono', monospace" font-size="2.4" fill="#FBF8F1" text-anchor="end" font-weight="600">d10</text><rect x="295.15" y="335.34" width="168.15" height="9.62" fill="#F2E1DD" stroke="none" stroke-width="0" /><text x="300.79" y="338.91" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">1</text><text x="305.43" y="338.91" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Высоту сдали.</text><text x="328.36" y="338.91" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Высоту, взятую неделю назад, сдали за час.</text><text x="305.43" y="343.13" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−2 псих.</text><text x="300.79" y="349.38" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">2</text><text x="305.43" y="349.38" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Отбить к утру.</text><text x="328.33" y="349.38" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Приказ: отбить высоту к утру. Людей — половина.</text><text x="305.43" y="353.6" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">🎲 Выносливость 15: успех — −1 физ.; провал — −4 физ. Офицер: А) вести самому (Вспыльчивость): 🎲</text><text x="305.43" y="357.81" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Харизма 15: успех — фронт +1, награда; провал — −2 физ., −2 псих. Б) доложить, что людей нет</text><text x="305.43" y="362.03" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">(Выдержка): −1 псих., d6 1–2 — выговор: −2 возм.</text><rect x="295.15" y="364.72" width="168.15" height="13.84" fill="#F2E1DD" stroke="none" stroke-width="0" /><text x="300.79" y="368.29" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">3</text><text x="305.43" y="368.29" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Пулемётчик.</text><text x="326.14" y="368.29" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Пулемётчик остаётся прикрывать отход. Он твоего года рождения.</text><text x="305.43" y="372.5" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">А) остаться с ним (Участие): 🎲 Ловкость 15: успех — +1 псих., козырь «Боевые друзья»; провал — −4 физ.</text><text x="305.43" y="376.72" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Б) уходить (Самолюбие): −2 псих.</text><text x="300.79" y="382.97" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">4</text><text x="305.43" y="382.97" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Землянка.</text><text x="322.72" y="382.97" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Новая землянка, старые крысы.</text><text x="305.43" y="387.19" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−1 физ., −1 псих.; Беспечность: ещё −1 физ.</text><rect x="295.15" y="389.88" width="168.15" height="9.62" fill="#F2E1DD" stroke="none" stroke-width="0" /><text x="300.79" y="393.45" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">5</text><text x="305.43" y="393.45" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Носки и рыба.</text><text x="328.65" y="393.45" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Посылка из дома: шерстяные носки и сушёная рыба.</text><text x="305.43" y="397.66" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">+1 физ., +1 псих.</text><text x="300.79" y="403.92" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">6</text><text x="305.43" y="403.92" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Навылет.</text><text x="320.97" y="403.92" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Пуля прошла навылет. Санитар говорит «повезло» и, кажется, не шутит.</text><text x="305.43" y="408.13" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−2 физ.; d6 4–6 — госпиталь: отпуск по ранению, +1 физ.</text><rect x="295.15" y="410.82" width="168.15" height="9.62" fill="#F2E1DD" stroke="none" stroke-width="0" /><text x="300.79" y="414.39" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">7</text><text x="305.43" y="414.39" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Слух о мире.</text><text x="326.3" y="414.39" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Говорят, наверху уже договариваются о мире.</text><text x="305.43" y="418.61" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">d6 1–3 — слух не подтвердился: −2 псих.; d6 4–6 — слух держится: +1 псих.</text><text x="300.79" y="424.86" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">8</text><text x="305.43" y="424.86" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Нет снарядов.</text><text x="328.42" y="424.86" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Своя артиллерия молчит: снарядов нет.</text><text x="305.43" y="429.08" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−1 физ., −1 псих.</text><rect x="295.15" y="431.76" width="168.15" height="9.62" fill="#F2E1DD" stroke="none" stroke-width="0" /><text x="300.79" y="435.33" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">9</text><text x="305.43" y="435.33" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Ладонь.</text><text x="319.36" y="435.33" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Сосед прострелил себе ладонь, чтобы уехать. Он просит молчать.</text><text x="305.43" y="439.55" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">А) молчать (Участие): d6 1–2 — особый отдел: −2 возм. Б) доложить (Самолюбие): +1 возм., −2 псих.</text><text x="300.79" y="445.81" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">10</text><text x="305.43" y="445.81" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Три часа сна.</text><text x="326.73" y="445.81" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Спишь три часа подряд — впервые за неделю.</text><text x="305.43" y="450.02" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">+1 физ.</text><rect x="468.1" y="325.6" width="169.35" height="146.6" fill="#FBF8F1" stroke="#7A2A22" stroke-width="0.6" /><rect x="468.1" y="325.6" width="169.35" height="8.2" fill="#7A2A22" stroke="none" stroke-width="0" /><text x="470.5" y="331.7" font-family="'PT Serif', serif" font-size="4.6" fill="#FBF8F1" font-weight="700">−3</text><text x="483.1" y="331.2" font-family="'IBM Plex Mono', monospace" font-size="2.7" fill="#FBF8F1" font-weight="700" letter-spacing="0.3">БРЕШЬ В ОБОРОНЕ</text><text x="635.05" y="331.2" font-family="'IBM Plex Mono', monospace" font-size="2.4" fill="#FBF8F1" text-anchor="end" font-weight="600">d10</text><rect x="468.7" y="335.34" width="168.15" height="9.62" fill="#F2E1DD" stroke="none" stroke-width="0" /><text x="474.34" y="338.91" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">1</text><text x="478.98" y="338.91" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Танки в бреши.</text><text x="503.65" y="338.91" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">В брешь идут танки, а у вас две гранаты на взвод.</text><text x="478.98" y="343.13" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">🎲 Ловкость 15: успех — награда; провал — −4 физ., −1 псих.</text><text x="474.34" y="349.38" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">2</text><text x="478.98" y="349.38" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">«Окружают!».</text><text x="501.47" y="349.38" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Кто-то кричит «окружают!», и рота бежит.</text><text x="478.98" y="353.6" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Выдержка: ты держишь роту: фронт +1. Вспыльчивость: ты бежишь первым: −2 псих. Остальные: 🎲</text><text x="478.98" y="357.81" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Мудрость 12: успех — −1 псих.; провал — −1 физ., −2 псих.</text><rect x="468.7" y="360.5" width="168.15" height="9.62" fill="#F2E1DD" stroke="none" stroke-width="0" /><text x="474.34" y="364.07" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">3</text><text x="478.98" y="364.07" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Дорога.</text><text x="492.6" y="364.07" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Дорога забита беженцами. По дороге бьют самолёты.</text><text x="478.98" y="368.29" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−2 псих.; 🎲 Ловкость 12: успех — ничего; провал — −3 физ.</text><text x="474.34" y="374.54" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">4</text><text x="478.98" y="374.54" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Пулемёты сзади.</text><text x="506.12" y="374.54" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Сзади стоят свои с пулемётами — чтобы никто не отступил.</text><text x="478.98" y="378.76" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Военная диктатура, госсоциализм, национализм: −2 псих. Иначе: −1 псих.</text><rect x="468.7" y="381.44" width="168.15" height="9.62" fill="#F2E1DD" stroke="none" stroke-width="0" /><text x="474.34" y="385.01" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">5</text><text x="478.98" y="385.01" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Брошенный склад.</text><text x="509.11" y="385.01" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Склад бросили. Бери, что унесёшь.</text><text x="478.98" y="389.23" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Хватка: +2 возм. Остальные: +1 физ.</text><text x="474.34" y="395.49" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">6</text><text x="478.98" y="395.49" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Связного нет.</text><text x="500.97" y="395.49" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Связной не вернулся. Второго тоже нет.</text><text x="478.98" y="399.7" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−1 псих. Офицер: А) идти самому (Участие): 🎲 Ловкость 15: успех — фронт +1, награда; провал — −3 физ.</text><text x="478.98" y="403.92" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Б) ждать (Выдержка): −1 псих., фронт −1</text><rect x="468.7" y="406.6" width="168.15" height="9.62" fill="#F2E1DD" stroke="none" stroke-width="0" /><text x="474.34" y="410.17" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">7</text><text x="478.98" y="410.17" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Чужие в нашей форме.</text><text x="515.46" y="410.17" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">В брешь просачиваются диверсанты в вашей форме.</text><text x="478.98" y="414.39" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">🎲 Смекалка 15: успех — награда; провал — −2 физ., −1 псих.</text><text x="474.34" y="420.65" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">8</text><text x="478.98" y="420.65" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Полдня тишины.</text><text x="505.78" y="420.65" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Противник тоже выдохся. Полдня тишины.</text><text x="478.98" y="424.86" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">+1 псих.</text><rect x="468.7" y="427.55" width="168.15" height="9.62" fill="#F2E1DD" stroke="none" stroke-width="0" /><text x="474.34" y="431.12" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">9</text><text x="478.98" y="431.12" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Орудие.</text><text x="492.98" y="431.12" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Орудие не вытащить. Приказ — не бросать.</text><text x="478.98" y="435.33" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">А) тащить (Усердие): −2 физ. Б) бросить (Беспечность): d6 1 — особый отдел: −2 возм.</text><text x="474.34" y="441.59" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">10</text><text x="478.98" y="441.59" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Выжженная земля.</text><text x="509.48" y="441.59" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Приказ: сжечь деревню у дороги, чтобы не досталась.</text><text x="478.98" y="445.81" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−2 псих. Офицер: А) поджечь (Самолюбие): отметка «Кровь на руках», −1 псих. Б) не поджигать (Участие):</text><text x="478.98" y="450.02" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">d6 1–2 — трибунал: тюрьма; d6 3–6 — обошлось: +2 псих.</text><rect x="641.65" y="325.6" width="169.35" height="146.6" fill="#FBF8F1" stroke="#7A2A22" stroke-width="0.6" /><rect x="641.65" y="325.6" width="169.35" height="8.2" fill="#7A2A22" stroke="none" stroke-width="0" /><text x="644.05" y="331.7" font-family="'PT Serif', serif" font-size="4.6" fill="#FBF8F1" font-weight="700">−4</text><text x="656.65" y="331.2" font-family="'IBM Plex Mono', monospace" font-size="2.7" fill="#FBF8F1" font-weight="700" letter-spacing="0.3">ПОТЕРЯ РЕЗЕРВОВ</text><text x="808.6" y="331.2" font-family="'IBM Plex Mono', monospace" font-size="2.4" fill="#FBF8F1" text-anchor="end" font-weight="600">d10</text><rect x="642.25" y="335.34" width="168.15" height="13.84" fill="#F2E1DD" stroke="none" stroke-width="0" /><text x="647.89" y="338.91" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">1</text><text x="652.53" y="338.91" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Пустой котёл.</text><text x="674.82" y="338.91" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Кухня не приезжала третий день.</text><text x="652.53" y="343.13" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−1 псих.; Хватка: припрятал сухари: −1 физ. Щедрость: отдаёшь свои сухари: −2 физ., +1 псих.</text><text x="652.53" y="347.34" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Остальные: −2 физ.</text><text x="647.89" y="353.6" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">2</text><text x="652.53" y="353.6" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Деды и мальчишки.</text><text x="684.22" y="353.6" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Пополнение: деды из ополчения и мальчишки шестнадцати лет.</text><text x="652.53" y="357.81" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−1 псих.; Участие: ещё −1 псих.</text><rect x="642.25" y="360.5" width="168.15" height="9.62" fill="#F2E1DD" stroke="none" stroke-width="0" /><text x="647.89" y="364.07" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">3</text><text x="652.53" y="364.07" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Мороз.</text><text x="665.08" y="364.07" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Ночью мороз, валенок нет.</text><text x="652.53" y="368.29" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">🎲 Выносливость 15: успех — −1 физ.; провал — −4 физ., −1 псих.</text><text x="647.89" y="374.54" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">4</text><text x="652.53" y="374.54" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Трое ушли.</text><text x="670.91" y="374.54" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Ночью ушли трое. Утром их привели обратно.</text><text x="652.53" y="378.76" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−2 псих. Офицер: А) отдать под трибунал (Выдержка): −2 псих. Б) записать в пропавшие (Участие): d6</text><text x="652.53" y="382.97" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">1–2 — особый отдел: «Офицерское звание» теряется</text><rect x="642.25" y="385.66" width="168.15" height="9.62" fill="#F2E1DD" stroke="none" stroke-width="0" /><text x="647.89" y="389.23" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">5</text><text x="652.53" y="389.23" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Махорка.</text><text x="668.57" y="389.23" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Махорку делят на шестерых и курят по очереди.</text><text x="652.53" y="393.45" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">Щедрость: +1 псих. Остальные: ничего</text><text x="647.89" y="399.7" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">6</text><text x="652.53" y="399.7" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Неделя без сна.</text><text x="678.12" y="399.7" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Неделю не спишь больше двух часов.</text><text x="652.53" y="403.92" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−1 физ.; Беспечность: ничего. Остальные: −1 псих.</text><rect x="642.25" y="406.6" width="168.15" height="9.62" fill="#F2E1DD" stroke="none" stroke-width="0" /><text x="647.89" y="410.17" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">7</text><text x="652.53" y="410.17" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Обозный бык.</text><text x="675.61" y="410.17" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Пал обозный мшистый бык. Мясо делят по ротам.</text><text x="652.53" y="414.39" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">+1 физ.</text><text x="647.89" y="420.65" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">8</text><text x="652.53" y="420.65" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Сводка.</text><text x="666.13" y="420.65" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Радио передаёт сводку. Вашего направления в сводке нет.</text><text x="652.53" y="424.86" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−1 псих.</text><rect x="642.25" y="427.55" width="168.15" height="9.62" fill="#F2E1DD" stroke="none" stroke-width="0" /><text x="647.89" y="431.12" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">9</text><text x="652.53" y="431.12" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Суп с той стороны.</text><text x="682.2" y="431.12" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">С той стороны кричат: «Сдавайтесь, у нас горячий суп!»</text><text x="652.53" y="435.33" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">А) поверить (сильный Аппетит): плен, −1 псих. Б) остаться (Выдержка): −1 псих.</text><text x="647.89" y="441.59" font-family="'PT Serif', serif" font-size="3.81" fill="#7A2A22" text-anchor="middle" font-weight="700">10</text><text x="652.53" y="441.59" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Держаться неделю.</text><text x="683.72" y="441.59" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Приказ держаться ещё неделю. Резервы будут.</text><text x="652.53" y="445.81" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−1 псих.; d6 5–6 — резервы пришли: +1 псих., фронт +1</text><rect x="121" y="476.4" width="169.35" height="146.6" fill="#FBF8F1" stroke="#1E1E24" stroke-width="0.6" /><rect x="121" y="476.4" width="169.35" height="8.2" fill="#1E1E24" stroke="none" stroke-width="0" /><text x="123.4" y="482.5" font-family="'PT Serif', serif" font-size="4.6" fill="#FBF8F1" font-weight="700">−5</text><text x="136" y="482" font-family="'IBM Plex Mono', monospace" font-size="2.7" fill="#FBF8F1" font-weight="700" letter-spacing="0.3">УГРОЗА ОКРУЖЕНИЯ</text><text x="287.95" y="482" font-family="'IBM Plex Mono', monospace" font-size="2.4" fill="#FBF8F1" text-anchor="end" font-weight="600">d10</text><rect x="121.6" y="486.14" width="168.15" height="9.62" fill="#E2E0DC" stroke="none" stroke-width="0" /><text x="127.24" y="489.71" font-family="'PT Serif', serif" font-size="3.81" fill="#1E1E24" text-anchor="middle" font-weight="700">1</text><text x="131.88" y="489.71" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Коридор.</text><text x="147.83" y="489.71" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Коридор шириной в две версты, и он сужается.</text><text x="131.88" y="493.93" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">🎲 Выносливость 15: успех — −1 физ., −1 псих.; провал — −4 физ., −1 псих.</text><text x="127.24" y="500.18" font-family="'PT Serif', serif" font-size="3.81" fill="#1E1E24" text-anchor="middle" font-weight="700">2</text><text x="131.88" y="500.18" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Сорок раненых.</text><text x="157.62" y="500.18" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Машин нет. Раненых — сорок.</text><text x="131.88" y="504.4" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">А) нести на себе (Участие): −2 физ., d6 4–6 — козырь «Боевые друзья». Б) оставить с санитаром</text><text x="131.88" y="508.61" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">(Самолюбие): −2 псих. Офицер: А) оставить и уходить (Выдержка): −3 псих. Б) задержаться (Участие):</text><text x="131.88" y="512.83" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">фронт −1, +1 псих.</text><rect x="121.6" y="515.52" width="168.15" height="9.62" fill="#E2E0DC" stroke="none" stroke-width="0" /><text x="127.24" y="519.09" font-family="'PT Serif', serif" font-size="3.81" fill="#1E1E24" text-anchor="middle" font-weight="700">3</text><text x="131.88" y="519.09" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Пепел.</text><text x="143.91" y="519.09" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Штаб жжёт документы. Пепел летит, как снег.</text><text x="131.88" y="523.3" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−1 псих.</text><text x="127.24" y="529.56" font-family="'PT Serif', serif" font-size="3.81" fill="#1E1E24" text-anchor="middle" font-weight="700">4</text><text x="131.88" y="529.56" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Брод.</text><text x="142.29" y="529.56" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Нужен брод. Знает его только местный старик.</text><text x="131.88" y="533.77" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">🎲 Харизма 12: успех — фронт +1; провал — −1 физ., −1 псих.</text><rect x="121.6" y="536.46" width="168.15" height="9.62" fill="#E2E0DC" stroke="none" stroke-width="0" /><text x="127.24" y="540.03" font-family="'PT Serif', serif" font-size="3.81" fill="#1E1E24" text-anchor="middle" font-weight="700">5</text><text x="131.88" y="540.03" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Три зелёные ракеты.</text><text x="164.95" y="540.03" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Прорыв назначен на полночь. Сигнал — три зелёные ракеты.</text><text x="131.88" y="544.25" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">🎲 Ловкость 15: успех — −1 псих.; провал — −4 физ., −1 псих.</text><text x="127.24" y="550.5" font-family="'PT Serif', serif" font-size="3.81" fill="#1E1E24" text-anchor="middle" font-weight="700">6</text><text x="131.88" y="550.5" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Мешки с неба.</text><text x="155.5" y="550.5" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Над кольцом пролетают свои самолёты и сбрасывают мешки. Половина мешков — к ним.</text><text x="131.88" y="554.72" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">+1 физ.</text><rect x="121.6" y="557.4" width="168.15" height="18.05" fill="#E2E0DC" stroke="none" stroke-width="0" /><text x="127.24" y="560.97" font-family="'PT Serif', serif" font-size="3.81" fill="#1E1E24" text-anchor="middle" font-weight="700">7</text><text x="131.88" y="560.97" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Заслон.</text><text x="145.17" y="560.97" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Приказ: оставить заслон. Заслон не вернётся.</text><text x="131.88" y="565.19" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">d6 1–2 — в заслон назначили тебя: 🎲 Выносливость 15: успех — награда; провал — −4 физ. Офицер: А)</text><text x="131.88" y="569.41" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">назначить (Выдержка): −3 псих. Б) остаться самому (Скромность): 🎲 Выносливость 18: успех — награда,</text><text x="131.88" y="573.62" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">+2 псих.; провал — −5 физ.</text><text x="127.24" y="579.88" font-family="'PT Serif', serif" font-size="3.81" fill="#1E1E24" text-anchor="middle" font-weight="700">8</text><text x="131.88" y="579.88" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Рассказы о плене.</text><text x="160.79" y="579.88" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">О плене рассказывают такое, что лучше уж здесь.</text><text x="131.88" y="584.09" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">−1 псих.</text><rect x="121.6" y="586.78" width="168.15" height="9.62" fill="#E2E0DC" stroke="none" stroke-width="0" /><text x="127.24" y="590.35" font-family="'PT Serif', serif" font-size="3.81" fill="#1E1E24" text-anchor="middle" font-weight="700">9</text><text x="131.88" y="590.35" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Медсанбат.</text><text x="150.77" y="590.35" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">В медсанбате медсестра перевязывает и поёт.</text><text x="131.88" y="594.57" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">+1 физ.; Влюбчивость: ещё +1 псих., есть Супруг(а) или Партнёр: d6 1 — дома узнали: Сплочённость −1</text><text x="127.24" y="600.82" font-family="'PT Serif', serif" font-size="3.81" fill="#1E1E24" text-anchor="middle" font-weight="700">10</text><text x="131.88" y="600.82" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">К своим.</text><text x="146.8" y="600.82" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Вышли к своим. Свои сначала не верят.</text><text x="131.88" y="605.04" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">+1 псих.; d6 1–2 — особый отдел: −2 возм., −1 псих.</text><rect x="294.55" y="476.4" width="169.35" height="146.6" fill="#FBF8F1" stroke="#1E1E24" stroke-width="0.6" /><rect x="294.55" y="476.4" width="169.35" height="8.2" fill="
