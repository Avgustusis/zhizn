1" fill="#1E1E24" text-anchor="middle" font-weight="700">6</text><text x="305.43" y="542.07" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Танк на школьной улице.</text><text x="344.73" y="542.07" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Танк ползёт по улице, где ты учился в школе.</text><text x="305.43" y="546.29" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">🎲 Ловкость 15: успех — награда; провал — −4 физ., −1 псих.</text><rect x="295.15" y="548.97" width="168.15" height="9.62" fill="#E2E0DC" stroke="none" stroke-width="0" /><text x="300.79" y="552.54" font-family="'PT Serif', serif" font-size="3.81" fill="#1E1E24" text-anchor="middle" font-weight="700">7</text><text x="305.43" y="552.54" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Резерв.</text><text x="318.6" y="552.54" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Ночью подошёл резерв. Свежие лица, чистая форма.</text><text x="305.43" y="556.76" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">+1 псих., фронт +1</text><text x="300.79" y="563.01" font-family="'PT Serif', serif" font-size="3.81" fill="#1E1E24" text-anchor="middle" font-weight="700">8</text><text x="305.43" y="563.01" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Подвал.</text><text x="319.39" y="563.01" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">В подвале под позицией — женщины и дети. Они слышат каждый выстрел.</text><text x="305.43" y="567.23" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">А) вывести их через реку (Участие): 🎲 Ловкость 15: успех — +2 псих.; провал — −4 физ. Б) держать</text><text x="305.43" y="571.45" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">позицию (Выдержка): −2 псих.</text><rect x="295.15" y="574.13" width="168.15" height="9.62" fill="#E2E0DC" stroke="none" stroke-width="0" /><text x="300.79" y="577.7" font-family="'PT Serif', serif" font-size="3.81" fill="#1E1E24" text-anchor="middle" font-weight="700">9</text><text x="305.43" y="577.7" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Кипяток.</text><text x="320.67" y="577.7" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Кипяток вместо чая. Лучший чай в жизни.</text><text x="305.43" y="581.92" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">+1 физ., +1 псих.</text><text x="300.79" y="588.17" font-family="'PT Serif', serif" font-size="3.81" fill="#1E1E24" text-anchor="middle" font-weight="700">10</text><text x="305.43" y="588.17" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24" font-weight="700">Склад на воздух.</text><text x="332.93" y="588.17" font-family="'PT Sans', sans-serif" font-size="3.13" fill="#4A4A55" font-style="italic">Склад рвут, чтобы не достался. Волной накрывает и своих.</text><text x="305.43" y="592.39" font-family="'PT Sans', sans-serif" font-size="3.4" fill="#1E1E24">🎲 Ловкость 12: успех — −1 псих.; провал — −4 физ.</text><rect x="468.1" y="476.4" width="169.35" height="146.6" fill="#F8F5EE" stroke="#1E1E24" stroke-width="0.5" /><rect x="468.1" y="476.4" width="169.35" height="8.2" fill="#23304A" stroke="none" stroke-width="0" /><text x="470.5" y="482" font-family="'IBM Plex Mono', monospace" font-size="2.7" fill="#FBF8F1" font-weight="700" letter-spacing="0.4">ХОД НА ФРОНТЕ</text><text x="470.5" y="489.66" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24" font-weight="700">Призыв —</text><text x="486.77" y="489.66" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">Добровольцы — в любой ход; военные — и на чужую войну. Молодость и Зрелость, граждане, пол —</text><text x="470.5" y="493.83" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">как в «Повестке»; при начале войны и каждый мировой ход. Армия — всегда; Народ — d6 1–4; Полиция,</text><text x="470.5" y="498" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">Интеллигенция, Мафия — 1–2; Олигархи — никогда. Военная диктатура, госсоциализм, национализм: 1–5 и 1–3.</text><text x="470.5" y="502.16" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">Либ. демократия — только Армия и добровольцы, пока метка не на её −3. Мафия откупается: −3 возм.</text><text x="470.5" y="506.33" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">(клептократия −1). Старость — демобилизация.</text><text x="470.5" y="512.01" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24" font-weight="700">Как тюрьма.</text><text x="490.26" y="512.01" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">Фишка идёт по полю жизни на d6, клетки не играются. Рынков, дохода и трат нет; Стаж +1 за ход.</text><text x="470.5" y="516.17" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">Жалованье +1 возм. — либеральная и социал-демократия, клептократия.</text><text x="470.5" y="521.85" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24" font-weight="700">В атаку:</text><text x="483.69" y="521.85" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">d6; 4–6 — метка на d4 клетки к противнику (у кого позиция выше — каждую вторую свою атаку d4 с</text><text x="470.5" y="526.02" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">преимуществом); 1 на кубике — −1 физ. Сильная Вспыльчивость — только так.</text><text x="470.5" y="531.7" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24" font-weight="700">Держать позицию:</text><text x="499.53" y="531.7" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">без броска атаки.</text><text x="470.5" y="537.38" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24" font-weight="700">Беречь себя:</text><text x="490.75" y="537.38" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">без броска; каждая потеря физ. на 1 меньше; после события d6 1–2 — метка на клетку к своим.</text><text x="470.5" y="543.05" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24" font-weight="700">Событие:</text><text x="485.59" y="543.05" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">d10 по таблице клетки, где метка, — со своего края. Офицер читает строку «Офицер».</text><text x="470.5" y="548.73" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24" font-weight="700">Здоровье:</text><text x="487.05" y="548.73" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">−8…−9 — комиссия: домой, лечение по идеологии. −10 — гибель (психика — как обычно, d6 на</text><text x="470.5" y="552.9" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">психбольницу). На −7 воюешь дальше; следующие −3 — гибель.</text><text x="470.5" y="558.58" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24" font-weight="700">Хранитель часов</text><text x="496.64" y="558.58" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">в конце круга бросает «В атаку» за сторону без солдат-игроков. Солдат-игроков нет ни у кого</text><text x="470.5" y="562.74" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">— трек не ведут: d6 на победителя: 6 — «Белый мир»; равные — 1–2 первая, 3–4 вторая, 5 переброс; разные —</text><text x="470.5" y="566.91" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">1–3 та, что выше, 4–5 слабая. Затем d6 итога.</text><text x="470.5" y="572.59" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24" font-weight="700">Черта в скобках</text><text x="495.75" y="572.59" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">обязывает: у кого она есть, выбирает этот вариант; «сильная» — только при сильной. Подходят</text><text x="470.5" y="576.76" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">два — выбор из них.</text><text x="470.5" y="582.43" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24" font-weight="700">Награда —</text><text x="487.64" y="582.43" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">Положение семьи +1 (до +3), только если шёл «В атаку».</text><text x="470.5" y="588.11" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24" font-weight="700">Военная диктатура:</text><text x="501.12" y="588.11" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">«Всегда готовы» — первый бросок атаки в войне — успех.</text><text x="470.5" y="593.79" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24" font-weight="700">Теократия, национализм:</text><text x="509.11" y="593.79" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">«Священная война» — раз за мировой ход переброс одного кубика войны (d6, d4</text><text x="470.5" y="597.96" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">или d10).</text><text x="470.5" y="603.64" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24" font-weight="700">Госсоциализм:</text><text x="493.09" y="603.64" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">«Ни шагу назад!» — враг на своей «ПОБЕДЕ»: d6 чёт — город взят, нечет — держится; второй</text><text x="470.5" y="607.8" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">нечет подряд — враг отброшен на свою +6.</text><text x="470.5" y="613.48" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24" font-weight="700">Офицер:</text><text x="484.75" y="613.48" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">раз за ход переброс d4 шагов; каждая потеря физ. на 1 меньше.</text><text x="470.5" y="619.16" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24" font-weight="700">Связи, козыри, антикозыри</text><text x="511.92" y="619.16" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">работают, вещи — нет. «Боевые друзья»: +5 к проверке или отменить потерю физ.</text><rect x="641.65" y="476.4" width="169.35" height="146.6" fill="#F8F5EE" stroke="#1E1E24" stroke-width="0.5" /><rect x="641.65" y="476.4" width="169.35" height="8.2" fill="#6B2A22" stroke="none" stroke-width="0" /><text x="644.05" y="482" font-family="'IBM Plex Mono', monospace" font-size="2.7" fill="#FBF8F1" font-weight="700" letter-spacing="0.4">КОНЕЦ ВОЙНЫ</text><text x="644.05" y="489.66" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24" font-weight="700">Победа —</text><text x="660.02" y="489.66" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">метка на +7 стороны. Победители читают «ПОБЕДА!» и домой; проигравшие: d6 1 — плен, иначе −1</text><text x="644.05" y="493.83" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">псих., домой.</text><text x="644.05" y="499.51" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24" font-weight="700">Мир —</text><text x="655.35" y="499.51" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">«Мирный договор» или смена власти в стране ядра (d6 4–6; при объявлении мировой войны — d12</text><text x="644.05" y="503.68" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">10–12). Итога нет, обеим стабильность +1.</text><text x="644.05" y="509.35" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24" font-weight="700">Проигравшая:</text><text x="666.39" y="509.35" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">стабильность −2, сразу проверка кризиса; победитель +1. Победитель бросает d6:</text><text x="644.05" y="515.03" font-family="'IBM Plex Mono', monospace" font-size="3.36" fill="#A8322B" font-weight="700">5–6</text><text x="652.79" y="515.03" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24" font-weight="700">Оккупация</text><text x="670.25" y="515.03" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">стабильность проигравшей −3, победителя +1; до следующего мирового хода −2 возм.</text><text x="652.79" y="519.2" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">контрибуции и выбор: сотрудничать или сопротивляться</text><text x="644.05" y="524.54" font-family="'IBM Plex Mono', monospace" font-size="3.36" fill="#A8322B" font-weight="700">3–4</text><text x="652.79" y="524.54" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24" font-weight="700">Смена режима</text><text x="676.01" y="524.54" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">идеология победителя; карта «Смута», стабильность 4, её сдвиги вдвое до следующего</text><text x="652.79" y="528.71" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">мирового хода</text><text x="644.05" y="534.05" font-family="'IBM Plex Mono', monospace" font-size="3.36" fill="#A8322B" font-weight="700">2</text><text x="652.79" y="534.05" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24" font-weight="700">Грабёж</text><text x="664.74" y="534.05" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">проигравшая выше — меняются позициями, иначе она на шаг ниже; демократии не грабят —</text><text x="652.79" y="538.22" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">смена режима</text><text x="644.05" y="543.56" font-family="'IBM Plex Mono', monospace" font-size="3.36" fill="#A8322B" font-weight="700">1</text><text x="652.79" y="543.56" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24" font-weight="700">Геноцид</text><text x="666.37" y="543.56" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">только национализм и больше одной группы; иначе клептократия и военная диктатура —</text><text x="652.79" y="547.72" font-family="'PT Sans', sans-serif" font-size="3.36" fill="#1E1E24">грабёж, остальные — оккупация</text><text x="644.05" y="555.42" font-family="'IBM Plex Mono', monospace" font-size="3.19" fill="#1E1E24" font-weight="700" letter-spacing="0.2">КОМИССИЯ И ГИБЕЛЬ — ПО ИДЕОЛОГИИ</text><line x1="643.65" y1="557.1" x2="809" y2="557.1" stroke="#1E1E24" stroke-width="0.25" /><text x="644.05" y="561.13" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#4A4A55" font-style="italic"></text><text x="677.92" y="561.13" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#4A4A55" font-style="italic">физ. −8…−9</text><text x="715.18" y="561.13" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#4A4A55" font-style="italic">псих. −8…−9</text><text x="752.43" y="561.13" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#4A4A55" font-style="italic">гибель на войне</text><text x="644.05" y="565.18" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24" font-weight="700">Либ. демократия</text><text x="677.92" y="565.18" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24">малый в больнице</text><text x="715.18" y="565.18" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24">малый у психолога</text><text x="752.43" y="565.18" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24">наследнику +4 возм.</text><text x="644.05" y="569.51" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24" font-weight="700">Соц.-демократия</text><text x="677.92" y="569.51" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24">большой в больнице</text><text x="715.18" y="569.51" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24">большой у психолога</text><text x="752.43" y="569.51" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24">наследнику +3 возм.</text><text x="644.05" y="573.85" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24" font-weight="700">Теократия</text><text x="677.92" y="573.85" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24">малый в больнице</text><text x="715.18" y="573.85" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24">малый в Храме</text><text x="752.43" y="573.85" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24">Сплочённость +1, наследнику +1 Мудрость</text><text x="644.05" y="578.18" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24" font-weight="700">Национализм</text><text x="677.92" y="578.18" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24">большой в больнице</text><text x="715.18" y="578.18" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24">—</text><text x="752.43" y="578.18" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24">Положение +1, наследнику +2 возм.</text><text x="644.05" y="582.51" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24" font-weight="700">Госсоциализм</text><text x="677.92" y="582.51" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24">большой в больнице</text><text x="715.18" y="582.51" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24">психбольница без «Учёта»</text><text x="752.43" y="582.51" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24">наследнику +3 возм., Сплочённость +1</text><text x="644.05" y="586.85" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24" font-weight="700">Военная диктатура</text><text x="677.92" y="586.85" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24">большой в госпитале</text><text x="715.18" y="586.85" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24">—</text><text x="752.43" y="586.85" font-family="'PT Sans', sans-serif" font-size="2.89" fill="#1E1E24">Положение +1, наследнику «Фамильное</text><text x="752.43" y="590.32" font-family="'PT S
